<!doctype html>
<html lang="en" data-palette="sage">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Timetable Reminder</title>
    <meta name="description" content="Clean college class schedule tracker with daily timeline, weekly grid, and pre-class reminder notifications." />
    <meta property="og:title" content="Timetable Reminder" />
    <meta property="og:description" content="Clean college class schedule tracker with daily timeline, weekly grid, and pre-class reminder notifications." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f5f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('timetable_reminder_settings_v1');
          var parsed = raw ? JSON.parse(raw) : {};
          var mode = parsed.themeMode || 'system';
          var palette = parsed.accentPalette || 'sage';
          document.documentElement.setAttribute('data-palette', palette);
          var isDark =
            mode === 'dark' ||
            (mode !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-canvas)] text-slate-900 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
